<div class="app-shell">
  <div
    class="mobile-backdrop"
    [class.visible]="isMobileMenuOpen"
    (click)="closeMobileMenu()"
    aria-hidden="true"
  ></div>

  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="isMobileMenuOpen">
    <div class="brand">
      <span class="brand-icon">₦</span>
      <span class="brand-name">KoboTracker</span>
    </div>

    <nav class="sidebar-navigation">
      <p class="navigation-label">MENU</p>

      <a
        class="navigation-link"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        (click)="closeMobileMenu()"
      >
        <span aria-hidden="true">▦</span>
        <span>Dashboard</span>
      </a>

      <a
        class="navigation-link"
        routerLink="/transactions"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="closeMobileMenu()"
      >
        <span aria-hidden="true">↔</span>
        <span>Transactions</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <p>Personal Finance</p>
      <span>Manage your money better.</span>
    </div>
  </aside>

  <!-- Main Application Area -->
  <main class="main-content">
    <header class="top-header">
      <div class="top-header-left">
        <button
          class="menu-toggle"
          type="button"
          aria-label="Toggle menu"
          aria-expanded="false"
          [attr.aria-expanded]="isMobileMenuOpen"
          (click)="toggleMobileMenu()"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div>
          <h1>KoboTracker</h1>
          <p>Your finances, clearly in view.</p>
        </div>
      </div>

      <div class="profile">
        <span class="profile-avatar">J</span>
        <span>My Account</span>
      </div>
    </header>

    <!-- Angular displays the selected page here -->
    <section class="page-content">
      <router-outlet />
    </section>
  </main>
</div>
