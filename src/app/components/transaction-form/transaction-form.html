<form
  class="transaction-form"
  #transactionForm="ngForm"
  (ngSubmit)="addTransaction()"
  novalidate
  aria-labelledby="transaction-form-title"
>
  <header class="form-heading">
    <h2 id="transaction-form-title">Add transaction</h2>
    <p>Record income or spending in your account.</p>
  </header>

  <div class="form-grid">
    <div class="form-field">
      <label for="transaction-description">Description</label>
      <input
        id="transaction-description"
        name="description"
        type="text"
        [(ngModel)]="description"
        maxlength="80"
        autocomplete="off"
        required
      />
    </div>

    <fieldset class="type-fieldset">
      <legend>Type</legend>
      <div class="type-options">
        <label class="type-option">
          <input
            type="radio"
            name="type"
            value="expense"
            [ngModel]="type"
            (ngModelChange)="onTypeChange($event)"
          />
          <span>Expense</span>
        </label>
        <label class="type-option">
          <input
            type="radio"
            name="type"
            value="income"
            [ngModel]="type"
            (ngModelChange)="onTypeChange($event)"
          />
          <span>Income</span>
        </label>
      </div>
    </fieldset>

    <div class="form-field">
      <label for="transaction-amount">Amount</label>
      <div class="amount-control">
        <span aria-hidden="true">₦</span>
        <input
          id="transaction-amount"
          name="amount"
          type="number"
          [(ngModel)]="amount"
          min="0.01"
          step="0.01"
          inputmode="decimal"
          required
        />
      </div>
    </div>

    @if (type === 'expense') {
      <div class="form-field">
        <label for="transaction-category">Category</label>
        <input
          id="transaction-category"
          name="category"
          type="text"
          [(ngModel)]="category"
          maxlength="40"
          placeholder="e.g. Food, transport"
          required
        />
      </div>
    }

    <div class="form-field">
      <label for="transaction-date">Date</label>
      <input id="transaction-date" name="date" type="date" [(ngModel)]="date" required />
    </div>
  </div>

  <div class="form-actions">
    <div class="form-feedback" aria-live="polite">
      <p class="error-message" role="alert">{{ errorMessage }}</p>
      <p class="success-message" role="status">{{ successMessage }}</p>
    </div>
    <button type="submit">Add transaction</button>
  </div>
</form>
